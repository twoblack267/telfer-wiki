# .pre-commit-config.yaml
# Place in telfer-wiki repo root. Run: pre-commit install --hook-type pre-commit

repos:
  - repo: local
    hooks:
      - id: validate-no-mark-refs
        name: "Validate: No first-person Mark references"
        entry: python scripts/validate-no-mark-refs.py
        language: system
        types: [json]
        files: ^src/data/.*\.json$
        verbose: true
        # Fails commit if any forbidden pattern found
        pass_filenames: true

  # Optional: run the purge script as a manual hook (not auto)
  - repo: local
    hooks:
      - id: purge-mark-refs
        name: "Purge: Remove Mark refs (manual only)"
        entry: python scripts/purge-mark-refs.py --apply
        language: system
        types: [json]
        files: ^src/data/.*\.json$
        verbose: true
        stages: [manual]
        pass_filenames: false

  # tw-2026-09-13-034: a regen re-imported RAW vault names into children/parents/spouses and
  # every existing gate stayed green. This blocks a commit that has lost slug resolution.
  - repo: local
    hooks:
      - id: validate-slug-shape
        name: "Validate: relationship refs are slugs, not raw display names"
        entry: node scripts/validate-slug-shape.mjs
        language: system
        files: ^src/data/people\.json$
        pass_filenames: false