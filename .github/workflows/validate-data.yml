name: Validate Data

# ─────────────────────────────────────────────────────────────────────────────
# CHANGE LOG — 2026-09-12 (Mark: "we never want this to happen again")
#
# The relationship resolver silently discarded ~94% of family links while every
# build reported success. Two new sentries now make that class of failure loud:
#
#   • RESOLVER COVERAGE GUARD — asserts the resolver itself (coverage floor +
#     named canaries) rather than the rendered output, so a relationship that
#     was never built can no longer hide behind "nothing rendered broken".
#   • ESCALATION — when a gate is red, scripts/ci-escalate.py pings the Hermes
#     ntfy topic (no secret in the repo; GitHub hosts the notification, the Mac
#     files the board card). The red build stands as the signal of record.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/content/**'
      - 'scripts/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/validate-data.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Data integrity
        id: integrity
        shell: bash
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee "$RUNNER_TEMP/gate.log"

      - name: Cross-branch contamination scan
        id: crossbranch
        shell: bash
        run: |
          set -o pipefail
          node scripts/scan-cross-branch.mjs 2>&1 | tee "$RUNNER_TEMP/gate.log"

      - name: No "Mark's relative" references in published data
        id: markrefs
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/validate-no-mark-refs.py src/data/ 2>&1 | tee "$RUNNER_TEMP/gate.log"

      # NEW 2026-09-12 — the sentry that would have caught the silent 94% discard.
      - name: Resolver coverage guard
        id: resolvercoverage
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-resolver-coverage.mjs 2>&1 | tee "$RUNNER_TEMP/gate.log"

      # npm run build runs the FULL chain, and the chain includes the Playwright
      # search-render e2e guard. Without browsers installed that guard throws
      # "Executable doesn't exist at .../ms-playwright/chromium_headless_shell-*"
      # and the build goes red for a reason that has NOTHING to do with the data.
      # (Real failure 2026-09-12: run 34663363735 failed here on a false alarm.)
      # deploy.yml has always installed Chromium; this job never did. Fixed.
      # META-GUARD: the fix above must not be accidentally deleted. If the
      # Chromium install step ever disappears, fail HERE with a clear message
      # instead of deep inside a Playwright stack trace.
      - name: Guard — Chromium install step must still exist
        run: |
          if ! grep -q 'playwright install chromium' .github/workflows/validate-data.yml; then
            echo "::error::Playwright Chromium install step was removed from validate-data.yml."
            echo "::error::npm run build runs the Playwright e2e guard; without browsers it fails."
            exit 1
          fi
          echo "OK: Chromium install step present"

      - name: Install Playwright Chromium (search-render e2e guard needs it)
        run: npx playwright install chromium --with-deps

      - name: Build must succeed
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/gate.log"

      # Runs ALWAYS (not only on failure) so the phone alert is itself verified:
      # if this step is skipped nobody ever finds out the pager is dead.
      - name: Escalation check (alerts on red, verifies the pager on green)
        if: always()
        env:
          SKIPPY_GATE: ${{ job.status }}
        run: |
          # An alerting hook must never be a failure mode. If this script is
          # missing or broken the step must still go green, because the real
          # signal is the build/job status itself.
          # (Real failure 2026-09-12: run 34663363705 went red a 2nd time purely
          #  because this file didn't exist in the checkout yet.)
          python3 scripts/ci-escalate.py || {
            echo "::warning::escalation hook unavailable — the red build status stands as the signal"
            true
          }
