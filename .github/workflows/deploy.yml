name: Deploy Telfer Wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ── SUPERSEDED-RUN CANCELLATION, added 2026-10-26 ────────────────────────────
# Concurrency group is PER COMMIT (`pages-${{ github.sha }}`), and a newer push
# cancels an older one. Why:
#
#   Before: one serialised `pages` group with cancel-in-progress: false. Every
#   push waited behind the previous run's verify-live, which can legitimately
#   poll for ~40 minutes. Five pushes in 35 minutes therefore stacked, and a
#   SUPERSEDED run sat polling for a build id the live site had already moved
#   past — 180 attempts, 42 minutes, then a red "LIVE SITE DOES NOT SERVE BUILD"
#   on a deploy that was never meant to be the final one. That is a false-red:
#   the fault was push cadence, not the site.
#
#   Per-SHA grouping keeps what the old group was actually protecting: two runs
#   can never deploy the same Pages artifact concurrently. But a superseded
#   commit no longer holds the queue hostage — GitHub cancels it the moment
#   newer work arrives. cancel-in-progress: true is safe here ONLY because the
#   group is per-SHA: it cancels a DIFFERENT commit's run, never this one's own
#   deploy mid-publish.
#
#   Corollary rule for whoever pushes: a cancelled (not failed) run is NORMAL
#   after a rapid second push. Only the newest run's verify-live speaks for the
#   live site.
concurrency:
  group: pages-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Unique build marker stamped into every page by scripts/stamp-build.mjs.
      # The verify-live job asserts the live site serves THIS id — if it doesn't,
      # the deploy silently failed to publish and the pipeline fails loudly.
      build_id: ${{ steps.read-build-id.outputs.build_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 2 (not the default shallow depth-1) FOR THE REDIRECT GUARD.
          # emit-git-slug-redirects.mjs must diff the CURRENT people.json against the
          # PREVIOUS commit that changed it — that is what the live site was last built
          # from. With a depth-1 clone there is no previous commit, so the diff is
          # 0 -> 0, no redirect page is emitted, and a deliberately removed profile
          # 404s in production (measured 2026-09-22: four of five removals 404'd live
          # while the same run emitted them locally). Two commits is all it needs.
          fetch-depth: 2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium (for search e2e guard)
        run: npx playwright install chromium --with-deps
      - name: Build site
        # Run the FULL build script (npm run build) NOT bare `npx astro build`.
        # The postbuild hook stamps a BUILD_ID (stamp-build.mjs), generates
        # people-redirects (generate-redirects.mjs), runs the alias-layer health
        # gate (check-redirect-health.mjs), and the link-integrity guards. CI must
        # exercise those or broken/legacy person links get deployed as 404s / the
        # "Page with redirect" / duplicate-canonical alerts come back.
        run: npm run build
        env:
          # Diagnostic for the redirect comparison base. emit-git-slug-redirects.mjs
          # must diff people.json against the PREVIOUS commit (the last-deployed
          # state). If that diff ever sees 0 vanished URLs in CI while the same run
          # sees them locally, this prints exactly which of the three cases it hit:
          # a git failure, unequal head/work, or no previous commit available.
          REDIRECT_DIAG: 1
      - name: Photo declarations check (every owner-supplied photo is declared)
        # Added 2026-11-08. The schema/markup change that puts each person's
        # photograph into their JSON-LD and the sitemap is worthless if nothing
        # proves it still covers every photo Mark uploads. This asserts three
        # numbers agree — records with person_photo, sitemap <image:image>, and
        # pages carrying `image` in their Person JSON-LD — and fails the deploy
        # if they don't. It also names any page that declares when it shouldn't,
        # which is the privacy-sensitive direction and the reason the check
        # runs in BOTH directions rather than only counting.
        run: node scripts/check-photo-declarations.mjs
        # No separate phone secret needed: the existing "Escalation check"
        # step below already pings the ntfy topic on ANY red build, and this
        # check can only fail the build. The script's own card hook stays
        # available (PHOTO_FAIL_CARD_URL) for running it outside Actions,
        # where there is no workflow to escalate.
      # ESCALATION — added 2026-09-12. `failure()` is false for a job that never
      # started, and a failed "Install dependencies" or Playwright step skips
      # everything after it; verifying the pager HERE (rather than at the end)
      # means the alert path is exercised on every green deploy too.
      - name: Escalation check (red build reaches the phone)
        if: always()
        env:
          SKIPPY_GATE: build
        run: |
          # An alerting hook must never be a failure mode. If this script is
          # missing or broken the step must still go green, because the real
          # signal is the build/job status itself.
          # (Real failure 2026-09-12: run 34663363705 went red a 2nd time purely
          #  because this file didn't exist in the checkout yet.)
          python3 scripts/ci-escalate.py || {
            echo "::warning::escalation hook unavailable — the red build status stands as the signal"
            true
          }
      - name: Read stamped build id
        id: read-build-id
        run: echo "build_id=$(cat dist/.build-id)" >> "$GITHUB_OUTPUT"
      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # SERIALISE THE PAGES DEPLOYMENT (added 2026-11-06).
    # The workflow-level group above is per-SHA, so two pushes to main are two
    # groups and run this deploy job in PARALLEL. GitHub Pages allows only ONE
    # deployment in flight per repo, so parallel deploys produce one of two reds:
    #   - HTTP 400 "Deployment request failed ... in progress deployment"
    #     (run 42170366266, sha d5cf45f, rejected because 98d84cf was in flight)
    #   - deploy-pages creates its deployment, polls an EMPTY status for 10 min,
    #     then cancels it (runs 41903304854, 42169876787).
    # A fixed group makes deploy jobs QUEUE instead of collide.
    # cancel-in-progress: false because the build already cost ~2 min — killing a
    # queued deploy only to start an identical one is waste. Safe to queue because
    # this job is short (checkout + deploy + purge, ~1-2 min); the 40-minute
    # backlog the old serialised group caused came from verify-live, which is NOT
    # in this group.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    # deploy-pages has its own 10-minute internal poll timer; this is a backstop.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ─────────────────────────────────────────────────────────────────────
      # BOUNDED RETRY FOR THE PAGES "EMPTY STATUS" STALL — added 2026-11-06.
      #
      # The concurrency group above stops deploy jobs COLLIDING, but it does not
      # stop one deploy from stalling on its own. GitHub's Pages deployment
      # record can sit at an empty/never-progressing status with nothing else in
      # flight, and deploy-pages then polls its own 10-minute timer out and
      # cancels the deployment it just created. Evidence, run 42178652796
      # (sha 145bd244): every deployment status for 7594527776 and for the rerun
      # 7594693295 went waiting -> queued -> in_progress -> failure, and the log
      # shows "Current status: syncing_files" then "Current status: " (blank) for
      # the remaining ~20 polls until "Timeout reached, aborting!". No other
      # deployment existed to collide with — this is a SERVER-SIDE stall, so
      # retrying is the correct response and serialising alone cannot fix it.
      #
      # ONE retry only. An unbounded retry against a genuine Pages outage would
      # burn runner minutes and hide the outage; one retry converts a ~10 minute
      # dead wait into a ~10 minute delay plus a publish, which is exactly what a
      # transient stall deserves. The retry fires for ANY failure of the deploy
      # attempt (deploy-pages has only stall/timeout failure modes — a permanent
      # config error fails fast and will fail twice, loudly, which is honest).
      # ─────────────────────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry deploy after Pages stall
        id: deployment
        if: steps.deployment_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # ─────────────────────────────────────────────────────────────────────
      # CACHE PURGE — added 2026-09-21 (card tw-2026-09-12-041).
      # Root cause: Cloudflare stamps cache-control: max-age=14400 on every
      # response, overriding the origin. A finish deploy — including a PRIVACY
      # fix — stays invisible at the edge for up to 4 hours, and the verify-live
      # job below was previously tuned to TOLERATE that (180 retries ≈ 40min)
      # rather than fixing it. Purging here makes a stale edge impossible
      # regardless of what any Cloudflare cache rule does.
      #
      # This step CANNOT fail the deploy: scripts/cf-purge-verify.sh exits 0
      # when the token is absent, invalid, or when the edge has not visibly
      # refreshed. A missing secret degrades protection, it does not break
      # publishing. (Same principle as the ci-escalate.py hooks.)
      #
      # Requires repo secret CLOUDFLARE_PURGE_TOKEN (Zone > Cache Purge > Purge).
      # ─────────────────────────────────────────────────────────────────────
      - name: Purge Cloudflare cache (best-effort, never fails the deploy)
        if: always()
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: bash scripts/cf-purge-verify.sh || true
  verify-live:
    # THE GUARD. Root cause this fix exists for: the old pipeline "succeeded" for
    # months while Pages served a stale branch — no check compared what users got
    # against what was built. This job fetches the live site and asserts it serves
    # this build's stamped BUILD_ID. Mismatch => deploy did NOT publish => FAIL.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Assert live site serves the just-published build
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          set -euo pipefail
          if [ -z "$BUILD_ID" ]; then echo "::error::no build_id output from build job"; exit 1; fi
          echo "Polling https://telferwiki.com for data-build-id=$BUILD_ID (Pages + Cloudflare edge can take several minutes to fully propagate)"
          # Re-roll the cache-busting param each attempt so Cloudflare cannot
          # serve a stale cached copy of a previously-seen URL, AND so that a
          # cache miss forces an origin fetch. Pages cold-propagation plus a
          # 4h Cloudflare TTL has, in practice, sometimes exceeded the old
          # ~5min window even though the deploy DID publish — producing
          # false-red ("deploy did not publish") on pushes that were actually live.
          # Longer window keeps the guard strict about a REAL stale deploy while
          # not crying wolf on ordinary propagation lag. Failure still means:
          # origin never served OUR build within the window -> genuine problem.
          #
          # ── RAISED 90 -> 180 ATTEMPTS, 2026-09-18 ──────────────────────────
          # Red run #35225365913 (2026-09-17) exhausted 90 retries (~15min) and
          # failed, yet the build WAS live: the deploy job finished 13:11:16Z and
          # Cloudflare's last-modified read 13:11:10Z. Re-probed the next morning
          # with the guard's own URL shape and the site served the asserted id
          # 3/3 times. So this was a REAL >15min edge-propagation lag on
          # telferwiki.com — a false-red, not a stale deploy. The guard's own
          # error text anticipates exactly this ("this is a caching/propagation
          # issue ... NOT necessarily bad content").
          # 180 retries x ~10-15s ≈ 35-40min covers Cloudflare's 4h TTL cold-path
          # with margin while still failing a genuinely unpublished deploy.
          attempts=180
          attempt=1
          DIAG=()
          # A probe that cannot return a positive is BROKEN, and a broken probe
          # must not cost 42 minutes. If the first FASTFAIL_AT attempts ALL fail
          # while the origin is provably serving the new build (purge step proved
          # cf-cache-status DYNAMIC), the probe itself is the suspect — dump the
          # diagnostics and bail early. See tw-2026-09-21-002.
          FASTFAIL_AT=20
          # ── MULTI-PATH CHECK, added 2026-09-21 (card tw-2026-09-12-041) ────
          # This guard used to poll the HOMEPAGE ONLY. That is a blind spot: on
          # 2026-09-21 a privacy fix was live at origin while the plain URL for
          # /people/mitchell-telfer-2008/ still served the OLD page — and a
          # homepage-only check cannot see it. Demonstrating it: a homepage-only
          # guard passes while a deep page is stale. Now we assert the build id
          # on a deep people page as well, so "the site is fresh" means more than
          # "the front door is fresh".
          PATHS=(
            "/"
            "/people/mitchell-telfer-2008/"
          )
          while [ "$attempt" -le "$attempts" ]; do
            all_ok=1
            for p in "${PATHS[@]}"; do
              url="https://telferwiki.com${p}?cb=${BUILD_ID}_${attempt}_$(date +%s)_${RANDOM}"
              # ── DO NOT pipe curl into `grep -q` HERE ──────────────────────
              # `grep -q` exits on the FIRST match and closes the pipe. curl then
              # dies of SIGPIPE with a non-zero status, and `set -o pipefail`
              # makes the whole pipeline report FAILURE — even though the match
              # SUCCEEDED. Result: a guard that can never pass, on any site, ever.
              #
              # This is exactly what happened in run 35575312095 (2026-09-21):
              # 180/180 attempts "not yet live" for 44 minutes on a deploy that
              # was live the whole time, producing a false-red build.
              #
              # Fixed by capturing the body into a variable first, then grep'ing
              # the variable — no pipeline, no SIGPIPE, no pipefail interaction.
              #
              # ── PER-ATTEMPT DIAGNOSTICS, added 2026-09-22 (tw-2026-09-21-002)
              # Second lesson from the SAME red run: even with the SIGPIPE bug
              # fixed, a failure printed only "attempt N/180: not yet live" —
              # no HTTP status, no cache status, no body size, no indication of
              # WHICH path failed. The next red would again be undebuggable after
              # the fact. So every failed attempt now captures the response
              # metadata. The BODY IS NEVER PRINTED (the page is family data);
              # only headers and a byte count.
              hdr="$(mktemp)"
              code="$(curl -sS -o /tmp/_vl_body -D "$hdr" --max-time 30 \
                        -A "Mozilla/5.0 (deploy-verify)" \
                        -w '%{http_code} %{url_effective} %{size_download} %{redirect_url}' \
                        "$url" 2>/dev/null)" || code=""
              set -- $code
              http_c="${1:-000}"; eff_url="${2:-?}"; bytes="${3:-0}"; redir="${4:-}"
              cf="$(grep -i '^cf-cache-status:' "$hdr" 2>/dev/null | tr -d '\r' | awk '{print $2}')"
              age="$(grep -i '^age:' "$hdr" 2>/dev/null | tr -d '\r' | awk '{print $2}')"
              lm="$(grep -i '^last-modified:' "$hdr" 2>/dev/null | tr -d '\r' | cut -d' ' -f2-)"
              got_id="$(grep -o 'data-build-id="[^"]*"' /tmp/_vl_body 2>/dev/null | head -1)"
              rm -f "$hdr"
              body="$(cat /tmp/_vl_body 2>/dev/null)" || body=""
              # ── NO PIPELINE. NO SIGPIPE. NO PIPE-BUFFER RACE. ────────────────
              # (tw-2026-11-07-001) This line used to be:
              #     if printf '%s' "$body" | grep -q "data-build-id=\"$BUILD_ID\""
              # That is the SAME SIGPIPE-under-pipefail hazard the 2026-09-21 fix
              # (tw-2026-09-21-002) removed from the curl side — reintroduced on
              # the printf side. $body is ~45KB, uncomfortably close to the 64KB
              # pipe buffer, so it is a RACE: grep -q exits on the first match and
              # closes the pipe; printf takes SIGPIPE finishing its write; pipefail
              # turns that into exit 141; the `if` takes the ELSE branch and
              # declares a perfectly live deploy "not yet live".
              # Run 42300036842 lost that race 20 times in a row, logging the
              # exact id it claimed not to find, and the runner printed
              #   "line 84: printf: Broken pipe"
              # on the check line itself — proof grep had already matched.
              # At 45KB it passes 10/10 locally and fails on a loaded runner:
              # an intermittent false-red that burns 20 attempts per deploy.
              #
              # grep reads the ALREADY-WRITTEN temp file /tmp/_vl_body directly.
              # No pipeline, no process substitution, no second writer — so grep
              # exiting on the first match cannot signal anyone. $body is kept
              # only for the diagnostic log line below.
              if grep -qF "data-build-id=\"$BUILD_ID\"" /tmp/_vl_body; then
                :
              else
                all_ok=0
                DIAG+=("attempt=$attempt path=$p http=$http_c cf=${cf:-?} age=${age:-?} bytes=$bytes got=${got_id:-<none>} redir=${redir:-<none>}")
                echo "    ✗ attempt=$attempt path=$p http=$http_c cf=${cf:-?} age=${age:-?} bytes=$bytes got=${got_id:-<none>}"
                [ -n "$redir" ] && echo "        redirect -> $redir"
                echo "        last-modified: ${lm:-<none>}"
              fi
            done
            if [ "$all_ok" -eq 1 ]; then
              echo "✅ LIVE SITE SERVES BUILD $BUILD_ID on all checked paths (attempt $attempt/$attempts)"
              printf '   checked: %s\n' "${PATHS[@]}"
              exit 0
            fi
            # Poll briskly at first (most publishes land within ~2-3min), then
            # ease off so we cover a wider real-world window without hammering.
            #
            # ── FAST-FAIL ON A BROKEN PROBE, added 2026-09-22 ────────────────
            # A probe that cannot return a positive must not burn 42 minutes.
            # If EVERY attempt so far failed, dump the collected diagnostics
            # immediately: whoever reads the red run then knows the HTTP status,
            # cache status, byte count and the id actually served — which is the
            # difference between "investigate" and "re-run it and hope".
            if [ "$attempt" -ge "$FASTFAIL_AT" ]; then
              echo "::error::verify-live failed $attempt consecutive attempts. Diagnostics (response metadata only — page body NOT printed):"
              printf '    - %s\n' "${DIAG[@]}"
              echo "    If 'got' shows a DIFFERENT build id, the edge is serving a stale copy -> propagation."
              echo "    If 'http' is not 200, or 'bytes' is tiny, the PROBE or the route is broken, NOT the deploy."
              exit 1
            fi
            if [ "$attempt" -lt 20 ]; then
              delay=10
            elif [ "$attempt" -lt 50 ]; then
              delay=12
            else
              delay=15
            fi
            echo "  attempt $attempt/$attempts: not yet live, waiting ${delay}s..."
            sleep "$delay"
            attempt=$((attempt+1))
          done
          echo "::error::LIVE SITE DOES NOT SERVE BUILD $BUILD_ID after $attempts retries (~40min). If the deploy DID publish this is a caching/propagation issue on telferwiki.com that needs investigation, NOT necessarily bad content. Investigate before re-deploying."
          echo "── last-observed diagnostics (response metadata only) ──"
          printf '    - %s\n' "${DIAG[@]}"
          exit 1
      # ─────────────────────────────────────────────────────────────────────
      # ESCALATION — added 2026-09-12 ("we never want this to happen again").
      # A red deploy was previously visible only to whoever happened to open the
      # Actions tab. Now any failure anywhere in this workflow pings the Hermes
      # ntfy topic (no secret in the repo) so it reaches the phone, and writes
      # .ci-escalation.json for the local CI Mechanic cron to file a board card.
      # Deliberately cannot fail the job: the red build is already the signal.
      # ─────────────────────────────────────────────────────────────────────
      - name: Escalation check
        if: failure()
        env:
          SKIPPY_GATE: deploy/verify-live
        run: |
          # An alerting hook must never be a failure mode. If this script is
          # missing or broken the step must still go green, because the real
          # signal is the build/job status itself.
          # (Real failure 2026-09-12: run 34663363705 went red a 2nd time purely
          #  because this file didn't exist in the checkout yet.)
          python3 scripts/ci-escalate.py || {
            echo "::warning::escalation hook unavailable — the red build status stands as the signal"
            true
          }
  escalate-on-start-failure:
    # 2026-09-12: `needs: [build, deploy]` means that if the BUILD job dies, this
    # job is SKIPPED — and a skipped job runs no steps, so the send-failure branch
    # inside it can never fire. That is the exact silent-failure hole this whole
    # change exists to close, so the pager gets its own job that runs whenever
    # anything upstream did not succeed.
    needs: [build, deploy, verify-live]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Escalation check (workflow did not complete cleanly)
        env:
          SKIPPY_GATE: deploy/upstream-failure
        run: |
          # An alerting hook must never be a failure mode. If this script is
          # missing or broken the step must still go green, because the real
          # signal is the build/job status itself.
          # (Real failure 2026-09-12: run 34663363705 went red a 2nd time purely
          #  because this file didn't exist in the checkout yet.)
          python3 scripts/ci-escalate.py || {
            echo "::warning::escalation hook unavailable — the red build status stands as the signal"
            true
          }
