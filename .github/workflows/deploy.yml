name: Deploy Telfer Wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Unique build marker stamped into every page by scripts/stamp-build.mjs.
      # The verify-live job asserts the live site serves THIS id — if it doesn't,
      # the deploy silently failed to publish and the pipeline fails loudly.
      build_id: ${{ steps.read-build-id.outputs.build_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium (for search e2e guard)
        run: npx playwright install chromium --with-deps
      - name: Build site
        # Run the FULL build script (npm run build) NOT bare `npx astro build`.
        # The postbuild hook stamps a BUILD_ID (stamp-build.mjs), generates
        # people-redirects (generate-redirects.mjs), runs the alias-layer health
        # gate (check-redirect-health.mjs), and the link-integrity guards. CI must
        # exercise those or broken/legacy person links get deployed as 404s / the
        # "Page with redirect" / duplicate-canonical alerts come back.
        run: npm run build
      # ESCALATION — added 2026-09-12. `failure()` is false for a job that never
      # started, and a failed "Install dependencies" or Playwright step skips
      # everything after it; verifying the pager HERE (rather than at the end)
      # means the alert path is exercised on every green deploy too.
      - name: Escalation check (red build reaches the phone)
        if: always()
        env:
          SKIPPY_GATE: build
        run: python3 scripts/ci-escalate.py
      - name: Read stamped build id
        id: read-build-id
        run: echo "build_id=$(cat dist/.build-id)" >> "$GITHUB_OUTPUT"
      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    # THE GUARD. Root cause this fix exists for: the old pipeline "succeeded" for
    # months while Pages served a stale branch — no check compared what users got
    # against what was built. This job fetches the live site and asserts it serves
    # this build's stamped BUILD_ID. Mismatch => deploy did NOT publish => FAIL.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Assert live site serves the just-published build
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          set -euo pipefail
          if [ -z "$BUILD_ID" ]; then echo "::error::no build_id output from build job"; exit 1; fi
          echo "Polling https://telferwiki.com for data-build-id=$BUILD_ID (Pages + Cloudflare edge can take several minutes to fully propagate)"
          # Re-roll the cache-busting param each attempt so Cloudflare cannot
          # serve a stale cached copy of a previously-seen URL, AND so that a
          # cache miss forces an origin fetch. Pages cold-propagation plus a
          # 4h Cloudflare TTL has, in practice, sometimes exceeded the old
          # ~5min window even though the deploy DID publish — producing
          # false-red ("deploy did not publish") on pushes that were actually live.
          # Longer window (90 retries x ~10s polling w/ an early fast pass) keeps
          # the guard strict about a REAL stale deploy while not crying wolf on
          # ordinary propagation lag. Failure still means: origin never served OUR
          # build within (about) 15min -> genuine problem, FIX REQUIRED.
          attempts=90
          attempt=1
          while [ "$attempt" -le "$attempts" ]; do
            url="https://telferwiki.com/?cb=${BUILD_ID}_${attempt}_$(date +%s)"
            if curl -fsS --max-time 30 -A "Mozilla/5.0 (deploy-verify)" "$url" 2>/dev/null | grep -q "data-build-id=\"$BUILD_ID\""; then
              echo "✅ LIVE SITE SERVES BUILD $BUILD_ID (attempt $attempt/$attempts)"
              exit 0
            fi
            # Poll briskly at first (most publishes land within ~2-3min), then
            # ease off so we cover a wider real-world window without hammering.
            if [ "$attempt" -lt 20 ]; then
              delay=10
            elif [ "$attempt" -lt 50 ]; then
              delay=12
            else
              delay=15
            fi
            echo "  attempt $attempt/$attempts: not yet live, waiting ${delay}s..."
            sleep "$delay"
            attempt=$((attempt+1))
          done
          echo "::error::LIVE SITE DOES NOT SERVE BUILD $BUILD_ID after $attempts retries (~15min). If the deploy DID publish this is a caching/propagation issue on telferwiki.com that needs investigation, NOT necessarily bad content. Investigate before re-deploying."
          exit 1
      # ─────────────────────────────────────────────────────────────────────
      # ESCALATION — added 2026-09-12 ("we never want this to happen again").
      # A red deploy was previously visible only to whoever happened to open the
      # Actions tab. Now any failure anywhere in this workflow pings the Hermes
      # ntfy topic (no secret in the repo) so it reaches the phone, and writes
      # .ci-escalation.json for the local CI Mechanic cron to file a board card.
      # Deliberately cannot fail the job: the red build is already the signal.
      # ─────────────────────────────────────────────────────────────────────
      - name: Escalation check
        if: failure()
        env:
          SKIPPY_GATE: deploy/verify-live
        run: python3 scripts/ci-escalate.py
  escalate-on-start-failure:
    # 2026-09-12: `needs: [build, deploy]` means that if the BUILD job dies, this
    # job is SKIPPED — and a skipped job runs no steps, so the send-failure branch
    # inside it can never fire. That is the exact silent-failure hole this whole
    # change exists to close, so the pager gets its own job that runs whenever
    # anything upstream did not succeed.
    needs: [build, deploy, verify-live]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Escalation check (workflow did not complete cleanly)
        env:
          SKIPPY_GATE: deploy/upstream-failure
        run: python3 scripts/ci-escalate.py
