name: Deploy Telfer Wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Unique build marker stamped into every page by scripts/stamp-build.mjs.
      # The verify-live job asserts the live site serves THIS id — if it doesn't,
      # the deploy silently failed to publish and the pipeline fails loudly.
      build_id: ${{ steps.read-build-id.outputs.build_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium (for search e2e guard)
        run: npx playwright install chromium --with-deps
      - name: Build site
        # Run the FULL build script (npm run build) NOT bare `npx astro build`.
        # The postbuild hook stamps a BUILD_ID (stamp-build.mjs), generates
        # people-redirects (generate-redirects.mjs), runs the alias-layer health
        # gate (check-redirect-health.mjs), and the link-integrity guards. CI must
        # exercise those or broken/legacy person links get deployed as 404s / the
        # "Page with redirect" / duplicate-canonical alerts come back.
        run: npm run build
      # ESCALATION — added 2026-09-12. `failure()` is false for a job that never
      # started, and a failed "Install dependencies" or Playwright step skips
      # everything after it; verifying the pager HERE (rather than at the end)
      # means the alert path is exercised on every green deploy too.
      - name: Escalation check (red build reaches the phone)
        if: always()
        env:
          SKIPPY_GATE: build
        run: |
          # An alerting hook must never be a failure mode. If this script is
          # missing or broken the step must still go green, because the real
          # signal is the build/job status itself.
          # (Real failure 2026-09-12: run 34663363705 went red a 2nd time purely
          #  because this file didn't exist in the checkout yet.)
          python3 scripts/ci-escalate.py || {
            echo "::warning::escalation hook unavailable — the red build status stands as the signal"
            true
          }
      - name: Read stamped build id
        id: read-build-id
        run: echo "build_id=$(cat dist/.build-id)" >> "$GITHUB_OUTPUT"
      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # ─────────────────────────────────────────────────────────────────────
      # CACHE PURGE — added 2026-09-21 (card tw-2026-09-12-041).
      # Root cause: Cloudflare stamps cache-control: max-age=14400 on every
      # response, overriding the origin. A finish deploy — including a PRIVACY
      # fix — stays invisible at the edge for up to 4 hours, and the verify-live
      # job below was previously tuned to TOLERATE that (180 retries ≈ 40min)
      # rather than fixing it. Purging here makes a stale edge impossible
      # regardless of what any Cloudflare cache rule does.
      #
      # This step CANNOT fail the deploy: scripts/cf-purge-verify.sh exits 0
      # when the token is absent, invalid, or when the edge has not visibly
      # refreshed. A missing secret degrades protection, it does not break
      # publishing. (Same principle as the ci-escalate.py hooks.)
      #
      # Requires repo secret CLOUDFLARE_PURGE_TOKEN (Zone > Cache Purge > Purge).
      # ─────────────────────────────────────────────────────────────────────
      - name: Purge Cloudflare cache (best-effort, never fails the deploy)
        if: always()
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: bash scripts/cf-purge-verify.sh || true
  verify-live:
    # THE GUARD. Root cause this fix exists for: the old pipeline "succeeded" for
    # months while Pages served a stale branch — no check compared what users got
    # against what was built. This job fetches the live site and asserts it serves
    # this build's stamped BUILD_ID. Mismatch => deploy did NOT publish => FAIL.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Assert live site serves the just-published build
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          set -euo pipefail
          if [ -z "$BUILD_ID" ]; then echo "::error::no build_id output from build job"; exit 1; fi
          echo "Polling https://telferwiki.com for data-build-id=$BUILD_ID (Pages + Cloudflare edge can take several minutes to fully propagate)"
          # Re-roll the cache-busting param each attempt so Cloudflare cannot
          # serve a stale cached copy of a previously-seen URL, AND so that a
          # cache miss forces an origin fetch. Pages cold-propagation plus a
          # 4h Cloudflare TTL has, in practice, sometimes exceeded the old
          # ~5min window even though the deploy DID publish — producing
          # false-red ("deploy did not publish") on pushes that were actually live.
          # Longer window keeps the guard strict about a REAL stale deploy while
          # not crying wolf on ordinary propagation lag. Failure still means:
          # origin never served OUR build within the window -> genuine problem.
          #
          # ── RAISED 90 -> 180 ATTEMPTS, 2026-09-18 ──────────────────────────
          # Red run #35225365913 (2026-09-17) exhausted 90 retries (~15min) and
          # failed, yet the build WAS live: the deploy job finished 13:11:16Z and
          # Cloudflare's last-modified read 13:11:10Z. Re-probed the next morning
          # with the guard's own URL shape and the site served the asserted id
          # 3/3 times. So this was a REAL >15min edge-propagation lag on
          # telferwiki.com — a false-red, not a stale deploy. The guard's own
          # error text anticipates exactly this ("this is a caching/propagation
          # issue ... NOT necessarily bad content").
          # 180 retries x ~10-15s ≈ 35-40min covers Cloudflare's 4h TTL cold-path
          # with margin while still failing a genuinely unpublished deploy.
          attempts=180
          attempt=1
          # ── MULTI-PATH CHECK, added 2026-09-21 (card tw-2026-09-12-041) ────
          # This guard used to poll the HOMEPAGE ONLY. That is a blind spot: on
          # 2026-09-21 a privacy fix was live at origin while the plain URL for
          # /people/mitchell-telfer-2008/ still served the OLD page — and a
          # homepage-only check cannot see it. Demonstrating it: a homepage-only
          # guard passes while a deep page is stale. Now we assert the build id
          # on a deep people page as well, so "the site is fresh" means more than
          # "the front door is fresh".
          PATHS=(
            "/"
            "/people/mitchell-telfer-2008/"
          )
          while [ "$attempt" -le "$attempts" ]; do
            all_ok=1
            for p in "${PATHS[@]}"; do
              url="https://telferwiki.com${p}?cb=${BUILD_ID}_${attempt}_$(date +%s)_${RANDOM}"
              # ── DO NOT pipe curl into `grep -q` HERE ──────────────────────
              # `grep -q` exits on the FIRST match and closes the pipe. curl then
              # dies of SIGPIPE with a non-zero status, and `set -o pipefail`
              # makes the whole pipeline report FAILURE — even though the match
              # SUCCEEDED. Result: a guard that can never pass, on any site, ever.
              #
              # This is exactly what happened in run 35575312095 (2026-09-21):
              # 180/180 attempts "not yet live" for 44 minutes on a deploy that
              # was live the whole time, producing a false-red build.
              #
              # Fixed by capturing the body into a variable first, then grep'ing
              # the variable — no pipeline, no SIGPIPE, no pipefail interaction.
              body="$(curl -fsS --max-time 30 -A "Mozilla/5.0 (deploy-verify)" "$url" 2>/dev/null)" || body=""
              if printf '%s' "$body" | grep -q "data-build-id=\"$BUILD_ID\""; then
                :
              else
                all_ok=0
              fi
            done
            if [ "$all_ok" -eq 1 ]; then
              echo "✅ LIVE SITE SERVES BUILD $BUILD_ID on all checked paths (attempt $attempt/$attempts)"
              printf '   checked: %s\n' "${PATHS[@]}"
              exit 0
            fi
            # Poll briskly at first (most publishes land within ~2-3min), then
            # ease off so we cover a wider real-world window without hammering.
            if [ "$attempt" -lt 20 ]; then
              delay=10
            elif [ "$attempt" -lt 50 ]; then
              delay=12
            else
              delay=15
            fi
            echo "  attempt $attempt/$attempts: not yet live, waiting ${delay}s..."
            sleep "$delay"
            attempt=$((attempt+1))
          done
          echo "::error::LIVE SITE DOES NOT SERVE BUILD $BUILD_ID after $attempts retries (~15min). If the deploy DID publish this is a caching/propagation issue on telferwiki.com that needs investigation, NOT necessarily bad content. Investigate before re-deploying."
          exit 1
      # ─────────────────────────────────────────────────────────────────────
      # ESCALATION — added 2026-09-12 ("we never want this to happen again").
      # A red deploy was previously visible only to whoever happened to open the
      # Actions tab. Now any failure anywhere in this workflow pings the Hermes
      # ntfy topic (no secret in the repo) so it reaches the phone, and writes
      # .ci-escalation.json for the local CI Mechanic cron to file a board card.
      # Deliberately cannot fail the job: the red build is already the signal.
      # ─────────────────────────────────────────────────────────────────────
      - name: Escalation check
        if: failure()
        env:
          SKIPPY_GATE: deploy/verify-live
        run: |
          # An alerting hook must never be a failure mode. If this script is
          # missing or broken the step must still go green, because the real
          # signal is the build/job status itself.
          # (Real failure 2026-09-12: run 34663363705 went red a 2nd time purely
          #  because this file didn't exist in the checkout yet.)
          python3 scripts/ci-escalate.py || {
            echo "::warning::escalation hook unavailable — the red build status stands as the signal"
            true
          }
  escalate-on-start-failure:
    # 2026-09-12: `needs: [build, deploy]` means that if the BUILD job dies, this
    # job is SKIPPED — and a skipped job runs no steps, so the send-failure branch
    # inside it can never fire. That is the exact silent-failure hole this whole
    # change exists to close, so the pager gets its own job that runs whenever
    # anything upstream did not succeed.
    needs: [build, deploy, verify-live]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Escalation check (workflow did not complete cleanly)
        env:
          SKIPPY_GATE: deploy/upstream-failure
        run: |
          # An alerting hook must never be a failure mode. If this script is
          # missing or broken the step must still go green, because the real
          # signal is the build/job status itself.
          # (Real failure 2026-09-12: run 34663363705 went red a 2nd time purely
          #  because this file didn't exist in the checkout yet.)
          python3 scripts/ci-escalate.py || {
            echo "::warning::escalation hook unavailable — the red build status stands as the signal"
            true
          }
